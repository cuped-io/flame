name: CI

# CI only — build/typecheck/lint/test. CDN publishing lives in release.yml,
# gated on an actual changesets release (ADR-0022): publishing from every
# main push both fought R2's write-once pins (same version, different bytes
# between releases) and served unreleased code on the floating flame.js.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # 10, as release.yml and e2e.yml: pnpm 9 does not read the
          # overrides in pnpm-workspace.yaml, so its frozen install refuses
          # the lockfile.
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # flame-react and flame-edge import types from @cuped-io/flame's built
      # dist (per its package.json `exports.types`), so the SDK has to be
      # built before downstream packages can typecheck.
      - name: Build @cuped-io/flame (provides types for downstream packages)
        run: pnpm --filter @cuped-io/flame build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
